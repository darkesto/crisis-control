<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crisis Control — Simulateur de réponse à incident</title>
  <meta name="description" content="Jeu sérieux de cybersécurité : cinq crises (hameçonnage, rançongiciel, DDoS, fuite cloud, menace interne) à gérer étape par étape. Français et anglais." />
  <link rel="icon" type="image/png" href="assets/img/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
  <style>
    /* Layout: an incident console. One reading column for the alert and the decision,
       a narrow rail for the incident log, instrument-style meters across the top. */
    :root {
      color-scheme: dark;
      --bg: #0a1120;
      --surface: #101a2e;
      --surface-2: #17233c;
      --line: #26365a;
      --ink: #eaeff8;
      --ink-2: #a5b3cc;
      --accent: #ff6a3d;
      --accent-2: #ff3d6e;
      --on-accent: #1c0c06;
      --term: #8ec3ff;
      --good: #3bd491;
      --good-bg: #0f2a24;
      --warn: #f6bb42;
      --warn-bg: #2c2412;
      --bad: #ff6675;
      --bad-bg: #331722;
      --shadow: 0 18px 48px rgba(2, 6, 16, .5);
      --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --fs-0: .75rem;
      --fs-1: .875rem;
      --fs-2: 1rem;
      --fs-3: 1.125rem;
      --fs-4: 1.375rem;
      --fs-5: clamp(1.75rem, 1.1rem + 3vw, 2.75rem);
      --r: 10px;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg: #f2f4f9; --surface: #ffffff; --surface-2: #e8ecf5; --line: #ccd5e6;
        --ink: #0e1830; --ink-2: #4a5874;
        --accent: #d4421a; --accent-2: #d21f58; --on-accent: #ffffff; --term: #1b5db5;
        --good: #0d7646; --good-bg: #e2f5ec; --warn: #855600; --warn-bg: #fbf0d6; --bad: #bd2334; --bad-bg: #fbe6e8;
        --shadow: 0 14px 36px rgba(20, 34, 66, .14);
      }
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f2f4f9; --surface: #ffffff; --surface-2: #e8ecf5; --line: #ccd5e6;
      --ink: #0e1830; --ink-2: #4a5874;
      --accent: #d4421a; --accent-2: #d21f58; --on-accent: #ffffff; --term: #1b5db5;
      --good: #0d7646; --good-bg: #e2f5ec; --warn: #855600; --warn-bg: #fbf0d6; --bad: #bd2334; --bad-bg: #fbe6e8;
      --shadow: 0 14px 36px rgba(20, 34, 66, .14);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 var(--fs-2)/1.55 var(--font-body);
      -webkit-text-size-adjust: 100%;
    }
    img, svg { max-width: 100%; }
    h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; }
    ol, ul { padding: 0; list-style: none; }
    button, input, textarea { font: inherit; color: inherit; }
    a { color: var(--term); }
    code { font-family: var(--font-mono); font-size: .92em; background: var(--surface-2); padding: .05em .35em; border-radius: 4px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    .app { max-width: 1120px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); padding-block: 16px 56px; display: flex; flex-direction: column; gap: 28px; }

    /* ---------- top bar ---------- */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
    .brand-mark { width: 44px; height: 44px; flex: none; border-radius: 10px; display: grid; place-items: center; overflow: hidden; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; background: var(--bg); }
    .brand-mark .icon { width: 24px; height: 24px; stroke-width: 2; }
    .brand-name { font: 800 var(--fs-3)/1.1 var(--font-display); letter-spacing: -.01em; }
    .brand-sub { font-size: var(--fs-0); color: var(--ink-2); letter-spacing: .02em; }
    .nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; padding: 8px 14px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      font-weight: 600; font-size: var(--fs-1); text-decoration: none; cursor: pointer;
      transition: background .15s, border-color .15s, transform .05s;
    }
    .btn:hover { background: var(--surface-2); border-color: var(--ink-2); }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(100deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--on-accent); font-size: var(--fs-2); min-height: 46px; padding-inline: 20px; }
    .btn-primary:hover { background: linear-gradient(100deg, var(--accent), var(--accent-2)); filter: brightness(1.08); border-color: transparent; }
    .btn-quiet { background: transparent; border-color: transparent; color: var(--ink-2); padding-inline: 8px; }
    .btn-quiet:hover { color: var(--ink); background: var(--surface); border-color: var(--line); }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
    .seg button { border: 0; background: transparent; padding: 0 12px; min-height: 38px; font: 600 var(--fs-0)/1 var(--font-mono); letter-spacing: .06em; color: var(--ink-2); cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

    /* ---------- shared type ---------- */
    .eyebrow { font: 500 var(--fs-0)/1.3 var(--font-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
    h1 { font: 800 var(--fs-5)/1.05 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
    h2 { font: 700 var(--fs-4)/1.2 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
    h3 { font: 600 var(--fs-2)/1.3 var(--font-body); }
    .lede { font-size: var(--fs-3); color: var(--ink-2); max-width: 62ch; }
    .muted { color: var(--ink-2); }
    .screen { display: flex; flex-direction: column; gap: 28px; }
    .block { display: flex; flex-direction: column; gap: 14px; }

    /* ---------- home ---------- */
    .hero { display: flex; flex-direction: column; gap: 14px; padding-block: clamp(8px, 3vw, 28px) 4px; }
    .hero h1 em { font-style: normal; background: linear-gradient(100deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lifecycle { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-block: 1px solid var(--line); }
    .lifecycle li { padding: 14px 14px 16px 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .lifecycle li + li { padding-left: 14px; border-left: 1px solid var(--line); }
    .lifecycle .n { font: 500 var(--fs-0)/1 var(--font-mono); color: var(--accent); }
    .lifecycle b { font: 700 var(--fs-2)/1.2 var(--font-display); }
    .lifecycle span:last-child { font-size: var(--fs-1); color: var(--ink-2); line-height: 1.4; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
    .card {
      display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto 1fr auto; column-gap: 14px; row-gap: 6px;
      text-align: left; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer;
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
    .card-random { border-style: dashed; background: transparent; }
    .card-icon { grid-row: 1 / span 2; width: 44px; height: 44px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
    .card-icon .icon { width: 24px; height: 24px; }
    .card-title { font: 700 var(--fs-3)/1.2 var(--font-display); }
    .card-pitch { font-size: var(--fs-1); color: var(--ink-2); line-height: 1.45; }
    .card-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); font: 500 var(--fs-0)/1.2 var(--font-mono); color: var(--ink-2); }
    .level { display: inline-flex; gap: 3px; align-items: center; }
    .level i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
    .level i.on { background: var(--accent); }
    .best { margin-left: auto; color: var(--ink); }
    .best b { font-family: var(--font-display); font-size: var(--fs-2); }
    .foot { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: var(--fs-1); color: var(--ink-2); }
    .foot ul { display: flex; flex-wrap: wrap; gap: 4px 16px; }

    /* ---------- briefing ---------- */
    .brief-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px 40px; align-items: start; }
    .facts { display: grid; gap: 10px; }
    .facts div { display: grid; gap: 2px; }
    .facts dt { font: 500 var(--fs-0)/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
    .facts dd { font-weight: 600; }
    .prose { max-width: 62ch; font-size: var(--fs-3); line-height: 1.6; }
    .rules { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
    .rules h3 { padding: 12px 14px; border-bottom: 1px solid var(--line); font: 500 var(--fs-0)/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
    .rules li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 11px 14px; }
    .rules li + li { border-top: 1px solid var(--line); }
    .rules .icon { grid-row: span 2; margin-top: 3px; color: var(--accent); }
    .rules b { font-size: var(--fs-1); }
    .rules span { font-size: var(--fs-1); color: var(--ink-2); line-height: 1.4; }
    .rules p { padding: 11px 14px; border-top: 1px solid var(--line); font-size: var(--fs-1); color: var(--ink-2); }

    /* ---------- play ---------- */
    .playbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
    .playbar h1 { font-size: var(--fs-4); }
    .stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .stepper li { display: flex; flex-direction: column; gap: 6px; min-width: 0; font: 500 var(--fs-0)/1.25 var(--font-mono); color: var(--ink-2); }
    .stepper li::before { content: ""; height: 4px; border-radius: 2px; background: var(--line); }
    .stepper li.done::before { background: var(--ink-2); }
    .stepper li.now { color: var(--ink); }
    .stepper li.now::before { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .stepper span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .gauge { display: grid; gap: 7px; padding: 11px 12px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
    .gauge-head { display: flex; align-items: center; gap: 7px; font-size: var(--fs-1); font-weight: 600; min-width: 0; }
    .gauge-head .icon { color: var(--ink-2); }
    .gauge-head .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gauge-val { margin-left: auto; display: flex; align-items: baseline; gap: 6px; font: 600 var(--fs-1)/1 var(--font-mono); font-variant-numeric: tabular-nums; }
    .delta { font-size: var(--fs-0); }
    .delta.up { color: var(--good); }
    .delta.down { color: var(--bad); }
    .meter { height: 10px; background: var(--surface-2); position: relative;
      -webkit-mask: repeating-linear-gradient(90deg, #000 0, #000 calc(5% - 2px), transparent calc(5% - 2px), transparent 5%);
              mask: repeating-linear-gradient(90deg, #000 0, #000 calc(5% - 2px), transparent calc(5% - 2px), transparent 5%); }
    .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--good); transition: width .5s ease, background .3s; }
    .meter i.mid { background: var(--warn); }
    .meter i.low { background: var(--bad); }

    .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 24px; align-items: start; }
    .stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .ticket { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
    .ticket-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); font: 500 var(--fs-0)/1.3 var(--font-mono); letter-spacing: .04em; color: var(--ink-2); }
    .ticket-head .time { color: var(--ink); font-weight: 600; }
    .ticket-head .live { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
    .ticket-head .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
    .ticket-head .step { margin-left: auto; }
    .ticket-body { padding: 16px; font-size: var(--fs-3); line-height: 1.55; max-width: 68ch; }
    @keyframes pulse { 50% { opacity: .25; } }
    .vocab { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: var(--fs-1); color: var(--ink-2); }
    .chip { border: 1px solid var(--line); background: transparent; color: var(--term); border-radius: 999px; padding: 3px 10px; font-size: var(--fs-1); cursor: pointer; }
    .chip:hover { border-color: var(--term); }
    .term { border: 0; background: none; padding: 0; color: inherit; cursor: help; text-decoration: underline dotted var(--term); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    button.term:hover { color: var(--term); }
    .ask { font: 600 var(--fs-2)/1.3 var(--font-body); }
    .choices { display: grid; gap: 8px; }
    .choice { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; line-height: 1.45; transition: border-color .15s, background .15s; }
    .choice:hover:not([disabled]) { border-color: var(--accent); background: var(--surface-2); }
    .choice .key { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font: 600 var(--fs-0)/1 var(--font-mono); color: var(--ink-2); }
    .choice[disabled] { cursor: default; }
    .choice[disabled]:not(.picked) { opacity: .5; }
    .choice.picked.good { border-color: var(--good); background: var(--good-bg); }
    .choice.picked.mixed { border-color: var(--warn); background: var(--warn-bg); }
    .choice.picked.bad { border-color: var(--bad); background: var(--bad-bg); }
    .choice.picked .key { color: var(--bg); border-color: transparent; }
    .choice.picked.good .key { background: var(--good); }
    .choice.picked.mixed .key { background: var(--warn); }
    .choice.picked.bad .key { background: var(--bad); }
    .choice.picked .key .icon { width: 15px; height: 15px; stroke-width: 2.6; }
    .feedback { display: grid; gap: 10px; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); border-left-width: 4px; background: var(--surface); }
    .feedback.good { border-left-color: var(--good); }
    .feedback.mixed { border-left-color: var(--warn); }
    .feedback.bad { border-left-color: var(--bad); }
    .verdict { display: inline-flex; align-items: center; gap: 8px; font: 700 var(--fs-3)/1.2 var(--font-display); }
    .good > .verdict, .verdict.good { color: var(--good); }
    .mixed > .verdict, .verdict.mixed { color: var(--warn); }
    .bad > .verdict, .verdict.bad { color: var(--bad); }
    .feedback p { max-width: 66ch; }
    .fx { display: flex; flex-wrap: wrap; gap: 6px; }
    .fx span { font: 500 var(--fs-0)/1 var(--font-mono); font-variant-numeric: tabular-nums; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); }
    .fx .up { color: var(--good); }
    .fx .down { color: var(--bad); }
    .stage-actions { display: flex; justify-content: flex-end; }

    .log { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
    .log-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font: 500 var(--fs-0)/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
    .log-head .term { color: var(--ink); text-transform: uppercase; letter-spacing: .08em; }
    .log ol { padding: 14px 14px 14px 30px; display: grid; gap: 14px; position: relative; }
    .log ol::before { content: ""; position: absolute; left: 17px; top: 20px; bottom: 20px; width: 1px; background: var(--line); }
    .log li { position: relative; display: grid; gap: 2px; font-size: var(--fs-1); line-height: 1.4; }
    .log li::before { content: ""; position: absolute; left: -17px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-2); }
    .log li.good::before { background: var(--good); border-color: var(--good); }
    .log li.mixed::before { background: var(--warn); border-color: var(--warn); }
    .log li.bad::before { background: var(--bad); border-color: var(--bad); }
    .log li.alert::before { border-color: var(--accent); }
    .log .when { font: 500 var(--fs-0)/1.3 var(--font-mono); color: var(--ink-2); }
    .log .empty { color: var(--ink-2); }

    /* ---------- debrief ---------- */
    .result { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 24px; align-items: center; padding: 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
    .grade { grid-row: span 2; width: clamp(84px, 16vw, 124px); aspect-ratio: 1; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); font: 800 clamp(3rem, 9vw, 4.75rem)/1 var(--font-display); }
    .result h1 { font-size: clamp(1.5rem, 1rem + 2.4vw, 2.25rem); }
    .result .sub { color: var(--ink-2); }
    .result .sub b { color: var(--ink); font-family: var(--font-mono); }
    .review { display: grid; gap: 10px; }
    .review > li { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-left-width: 4px; border-radius: var(--r); background: var(--surface); }
    .review > li.good { border-left-color: var(--good); }
    .review > li.mixed { border-left-color: var(--warn); }
    .review > li.bad { border-left-color: var(--bad); }
    .review .where { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font: 500 var(--fs-0)/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
    .review .where .verdict { font: 600 var(--fs-0)/1.3 var(--font-mono); letter-spacing: .06em; margin-left: auto; gap: 5px; }
    .review .picked { font-weight: 600; max-width: 70ch; }
    .review p { max-width: 70ch; }
    .review .better { padding: 10px 12px; border-radius: 8px; background: var(--good-bg); display: grid; gap: 4px; }
    .review .better b { font: 500 var(--fs-0)/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--good); }
    .takeaways { display: grid; gap: 10px; max-width: 72ch; }
    .takeaways li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
    .takeaways .icon { color: var(--accent); margin-top: 4px; }
    .terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 0 32px; }
    .terms div { padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
    .terms dt { font-weight: 600; }
    .terms dd { font-size: var(--fs-1); color: var(--ink-2); line-height: 1.45; }
    .end-actions { display: flex; flex-wrap: wrap; gap: 10px; }

    /* ---------- dialogs & popover ---------- */
    dialog { width: min(680px, calc(100vw - 32px)); max-height: min(86vh, 760px); padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(4, 8, 18, .62); }
    dialog[open] { display: flex; flex-direction: column; }
    .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .dlg-head h2 { font-size: var(--fs-3); }
    .dlg-body { padding: 18px; overflow: auto; display: grid; gap: 14px; }
    .dlg-body ol.how { display: grid; gap: 10px; counter-reset: how; }
    .dlg-body ol.how li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; counter-increment: how; }
    .dlg-body ol.how li::before { content: counter(how); font: 600 var(--fs-0)/1.9 var(--font-mono); color: var(--accent); }
    .field { display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
    .field input { flex: 1; min-width: 0; min-height: 42px; border: 0; background: transparent; outline: 0; }
    .field:focus-within { border-color: var(--accent); }
    textarea.report { width: 100%; min-height: 300px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: 400 var(--fs-1)/1.5 var(--font-mono); }
    .dlg-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .pop { position: fixed; z-index: 50; width: min(320px, calc(100vw - 24px)); padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); box-shadow: var(--shadow); font-size: var(--fs-1); line-height: 1.45; }
    .pop b { display: block; font: 700 var(--fs-2)/1.3 var(--font-display); margin-bottom: 3px; color: var(--term); }

    /* ---------- responsive ---------- */
    @media (max-width: 900px) {
      .cols { grid-template-columns: minmax(0, 1fr); }
      .brief-grid { grid-template-columns: minmax(0, 1fr); }
      .lifecycle { grid-template-columns: minmax(0, 1fr); border-bottom: 0; }
      .lifecycle li, .lifecycle li + li { padding: 10px 0; border-left: 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 2ch minmax(0, 8.5em) minmax(0, 1fr); gap: 10px; align-items: baseline; }
    }
    @media (max-width: 640px) {
      .gauges { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stepper span { display: none; }
      .stepper li.now span { display: block; position: absolute; }
      .stepper { position: relative; padding-bottom: 20px; }
      .stepper li.now span { left: 0; bottom: 0; }
      .brand-sub { display: none; }
      .ticket-body { font-size: var(--fs-2); }
      .result { grid-template-columns: minmax(0, 1fr); }
      .grade { grid-row: auto; }
      .lifecycle li, .lifecycle li + li { grid-template-columns: 2ch minmax(0, 1fr); }
      .lifecycle li span:last-child { grid-column: 2; }
      .nav .btn .lbl { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <script>
/* =====================================================================
   CONTENT — glossary, then one block per scenario.
   To add a scenario: copy a block, change the key, add it to SCENARIO_ORDER.
   Each text is [French, English]. fx = effect on s(ecurity) t(ime) c(ost) r(eputation).
   v = good | mixed | bad. next = id of the following node, or null at the end.
   ===================================================================== */

const SCENARIOS = {};

/* Glossary — id: { l: [label FR, label EN], d: [definition FR, definition EN] }
   In any scenario text, write [[id]] to insert the label, or [[id|custom words]]. */
const GLOSSARY = {
  access_logs: { l: ["journaux d'accès", "access logs"], d: ["Historique de qui a lu ou modifié quoi, et quand. Sans eux, impossible de mesurer une fuite après coup.", "A record of who read or changed what, and when. Without them a leak cannot be measured afterwards."] },
  anssi: { l: ["ANSSI", "ANSSI"], d: ["Agence nationale de la sécurité des systèmes d'information : l'autorité française de cybersécurité. Elle publie des guides et aide les organisations attaquées.", "France's national cybersecurity agency. It publishes guidance and assists organisations under attack."] },
  anti_ddos: { l: ["centre de nettoyage", "scrubbing centre"], d: ["Service qui reçoit tout le trafic d'un site, retire la partie malveillante et ne transmet que le trafic légitime.", "A service that receives all of a site's traffic, removes the malicious part and passes on only legitimate traffic."] },
  api_key: { l: ["clé d'API", "API key"], d: ["Mot de passe utilisé par un programme pour accéder à un service. Qui la possède peut agir à la place du programme.", "A password used by a program to access a service. Whoever holds it can act in the program's place."] },
  autoscaling: { l: ["autoscaling", "autoscaling"], d: ["Ajout automatique de serveurs quand la charge augmente. Pratique pour une affluence réelle, coûteux et inefficace face à une attaque.", "Automatically adding servers as load rises. Handy for real demand, costly and ineffective against an attack."] },
  backdoor: { l: ["portes dérobées", "backdoors"], d: ["Accès cachés qu'un attaquant installe pour pouvoir revenir, même après un changement de mot de passe.", "Hidden access an attacker installs so they can come back, even after passwords are changed."] },
  backup321: { l: ["règle 3-2-1", "3-2-1 rule"], d: ["Trois copies des données, sur deux supports différents, dont une hors ligne ou hors site.", "Three copies of the data, on two different media, one of them offline or off-site."] },
  botnet: { l: ["botnet", "botnet"], d: ["Réseau de milliers de machines infectées (PC, caméras, box) pilotées à distance par un attaquant, à l'insu de leurs propriétaires.", "A network of thousands of infected machines (PCs, cameras, routers) remotely controlled by an attacker without their owners knowing."] },
  bucket: { l: ["bucket", "bucket"], d: ["Espace de stockage de fichiers dans le cloud. Il peut être privé ou, par erreur, lisible par tout Internet.", "A file storage space in the cloud. It can be private or, by mistake, readable by the whole Internet."] },
  c2: { l: ["C2", "C2"], d: ["« Command and Control » : le serveur depuis lequel l'attaquant envoie ses ordres aux machines infectées.", "“Command and Control”: the server from which the attacker sends orders to infected machines."] },
  cdn: { l: ["CDN", "CDN"], d: ["Réseau de serveurs répartis dans le monde, placé devant un site web. Il accélère l'affichage et peut filtrer les attaques avant qu'elles n'atteignent le site.", "A worldwide network of servers placed in front of a website. It speeds up loading and can filter attacks before they reach the site."] },
  cellule_crise: { l: ["cellule de crise", "crisis team"], d: ["Petit groupe qui pilote la réponse : technique, direction, juridique, communication. Elle décide, répartit les tâches et tient la main courante.", "The small group steering the response: technical, management, legal, communications. It decides, assigns tasks and keeps the incident log."] },
  chain_custody: { l: ["chaîne de preuve", "chain of custody"], d: ["Suivi écrit de chaque manipulation d'une preuve : qui, quand, comment. Il garantit qu'elle n'a pas été modifiée.", "A written record of every handling of a piece of evidence: who, when, how. It guarantees it has not been altered."] },
  cnil: { l: ["CNIL", "CNIL"], d: ["Autorité française de protection des données. Une violation de données personnelles doit lui être notifiée dans les 72 heures.", "The French data protection authority. A personal data breach must be reported to it within 72 hours."] },
  contre_appel: { l: ["contre-appel", "call-back check"], d: ["Vérifier une demande sensible (changement de RIB, virement urgent) en rappelant la personne à un numéro déjà connu.", "Checking a sensitive request (new bank details, urgent transfer) by calling the person back on a number you already know."] },
  coordinated_disclosure: { l: ["divulgation coordonnée", "coordinated disclosure"], d: ["Accord entre un chercheur et une entreprise : il publie sa découverte après la correction de la faille, à une date convenue.", "An agreement between a researcher and a company: the finding is published after the flaw is fixed, on an agreed date."] },
  cspm: { l: ["CSPM", "CSPM"], d: ["Outil qui vérifie en continu la configuration d'un compte cloud et alerte dès qu'un réglage devient dangereux.", "A tool that continuously checks a cloud account's configuration and alerts as soon as a setting becomes dangerous."] },
  ddos: { l: ["DDoS", "DDoS"], d: ["Déni de service distribué : noyer un site sous un trafic venu de milliers de machines pour le rendre inaccessible.", "Distributed denial of service: flooding a site with traffic from thousands of machines to make it unreachable."] },
  decryptor: { l: ["déchiffreur", "decryptor"], d: ["Programme censé rendre les fichiers lisibles après un rançongiciel. Celui des attaquants est souvent lent et incomplet.", "A program meant to make files readable again after ransomware. The attackers' own is often slow and incomplete."] },
  disk_image: { l: ["image disque", "disk image"], d: ["Copie exacte, bit à bit, d'un disque dur. L'enquête se fait sur la copie pour ne pas altérer l'original.", "An exact, bit-for-bit copy of a hard drive. The investigation works on the copy so the original stays unaltered."] },
  diversion: { l: ["diversion", "diversion"], d: ["Attaque bruyante lancée pour occuper les équipes pendant qu'une intrusion discrète se déroule ailleurs.", "A noisy attack launched to keep teams busy while a quiet intrusion takes place elsewhere."] },
  dlp: { l: ["DLP", "DLP"], d: ["« Data Loss Prevention » : outils qui repèrent et bloquent la sortie de données sensibles (envoi massif, copie sur clé USB).", "“Data Loss Prevention”: tools that spot and block sensitive data leaving (bulk uploads, copies to USB sticks)."] },
  double_extorsion: { l: ["double extorsion", "double extortion"], d: ["L'attaquant chiffre les fichiers et les vole. Il menace de les publier si la rançon n'est pas payée.", "The attacker both encrypts the files and steals them, threatening to publish them if the ransom is not paid."] },
  dpo: { l: ["DPO", "DPO"], d: ["Délégué à la protection des données : la personne qui veille au respect du RGPD et fait le lien avec la CNIL.", "Data Protection Officer: the person who ensures GDPR compliance and liaises with the data protection authority."] },
  edr: { l: ["EDR", "EDR"], d: ["Agent installé sur les postes et serveurs. Il détecte les comportements suspects et permet d'isoler une machine à distance.", "An agent installed on workstations and servers. It detects suspicious behaviour and can isolate a machine remotely."] },
  egress: { l: ["flux sortants", "outbound traffic"], d: ["Connexions qui partent du réseau de l'entreprise vers Internet. Les couper empêche de sortir des données ou de recevoir des ordres.", "Connections leaving the company network for the Internet. Cutting them stops data going out and orders coming in."] },
  exfiltration: { l: ["exfiltration", "exfiltration"], d: ["Copie de données hors de l'entreprise, sans autorisation.", "Copying data out of the company without authorisation."] },
  fiche_reflexe: { l: ["fiche réflexe", "playbook"], d: ["Procédure courte et écrite à l'avance : qui fait quoi, dans quel ordre, pour un type d'incident donné.", "A short procedure written in advance: who does what, in what order, for a given type of incident."] },
  forensic: { l: ["investigation numérique", "forensics"], d: ["Analyse des traces laissées sur les machines pour reconstituer l'attaque : point d'entrée, actions, données touchées.", "Analysing traces left on machines to reconstruct the attack: entry point, actions, data affected."] },
  fovi: { l: ["fraude au virement", "payment diversion fraud"], d: ["L'escroc se fait passer pour un fournisseur ou un dirigeant et obtient un virement vers son propre compte.", "The fraudster poses as a supplier or an executive and obtains a transfer to their own account."] },
  geoblock: { l: ["géoblocage", "geo-blocking"], d: ["Refuser les connexions venant de certains pays. Simple, mais imprécis et facile à contourner.", "Refusing connections from certain countries. Simple, but imprecise and easy to get around."] },
  iac: { l: ["IaC", "IaC"], d: ["« Infrastructure as Code » : la configuration des serveurs et du cloud est écrite dans des fichiers relus et versionnés, pas cliquée à la main.", "“Infrastructure as Code”: server and cloud configuration is written in reviewed, versioned files rather than clicked by hand."] },
  inbox_rule: { l: ["règle de transfert", "inbox forwarding rule"], d: ["Réglage de messagerie qui renvoie automatiquement les e-mails vers une autre adresse. Les attaquants en créent pour espionner sans se reconnecter.", "A mail setting that automatically forwards emails to another address. Attackers create them to spy without signing in again."] },
  insider: { l: ["menace interne", "insider threat"], d: ["Risque venant d'une personne qui a un accès légitime : salarié, prestataire, stagiaire. Par malveillance ou par négligence.", "A risk coming from someone with legitimate access: employee, contractor, intern. Through malice or carelessness."] },
  l7: { l: ["couche 7", "layer 7"], d: ["Niveau applicatif du réseau. Une attaque de couche 7 envoie des requêtes web d'apparence normale, plus difficiles à distinguer des vrais visiteurs.", "The application level of the network. A layer 7 attack sends normal-looking web requests that are harder to tell from real visitors."] },
  lateral: { l: ["mouvement latéral", "lateral movement"], d: ["Déplacement de l'attaquant d'une machine à l'autre à l'intérieur du réseau, pour atteindre des cibles plus intéressantes.", "The attacker moving from machine to machine inside the network to reach more valuable targets."] },
  least_privilege: { l: ["moindre privilège", "least privilege"], d: ["Chacun n'a que les droits nécessaires à son travail, rien de plus.", "Everyone has only the rights needed for their job and nothing more."] },
  main_courante: { l: ["main courante", "incident log"], d: ["Journal horodaté de la crise : chaque alerte, chaque décision, chaque action. Il sert pendant la crise et pour le retour d'expérience.", "A timestamped log of the crisis: every alert, decision and action. It is used during the crisis and for the review afterwards."] },
  mfa: { l: ["MFA", "MFA"], d: ["Authentification multifacteur : en plus du mot de passe, une seconde preuve (application, clé physique). Un mot de passe volé ne suffit plus.", "Multi-factor authentication: on top of the password, a second proof (app, hardware key). A stolen password is no longer enough."] },
  mode_degrade: { l: ["mode dégradé", "degraded mode"], d: ["Fonctionner volontairement avec moins de fonctions pour préserver l'essentiel pendant une crise.", "Deliberately running with fewer features to protect the essentials during a crisis."] },
  obscurity: { l: ["sécurité par l'obscurité", "security through obscurity"], d: ["Compter sur le fait qu'une ressource est cachée plutôt que réellement protégée. Cela ne résiste pas à une recherche automatisée.", "Relying on a resource being hidden rather than actually protected. It does not survive an automated search."] },
  offboarding: { l: ["procédure de départ", "offboarding"], d: ["Étapes à suivre quand quelqu'un quitte l'entreprise : retrait des accès, restitution du matériel, transfert des dossiers.", "The steps followed when someone leaves the company: removing access, returning equipment, handing over files."] },
  offline_backup: { l: ["sauvegardes hors ligne", "offline backups"], d: ["Copies des données déconnectées du réseau. Un rançongiciel ne peut pas les atteindre.", "Copies of the data that are disconnected from the network. Ransomware cannot reach them."] },
  patient0: { l: ["patient zéro", "patient zero"], d: ["La première machine infectée. La retrouver permet de comprendre comment l'attaquant est entré.", "The first machine infected. Finding it shows how the attacker got in."] },
  personal_data: { l: ["données personnelles", "personal data"], d: ["Toute information liée à une personne identifiable : nom, e-mail, RIB, bulletin de paie. Elles sont protégées par le RGPD.", "Any information linked to an identifiable person: name, email, bank details, payslip. It is protected by the GDPR."] },

/* French typography: non-breaking spaces before ; : ! ? and inside « », curly apostrophes. */
function typo(s) {
  s = String(s).replace(/'/g, "’");
  if (S.lang === "fr") {
    s = s.replace(/ ([;!?])/g, " $1").replace(/ ([:»])/g, " $1").replace(/« /g, "« ")
      .replace(/(\d) (\d{3})(?!\d)/g, "$1 $2").replace(/(\d) (h|€|%)/g, "$1 $2");
  }
  return s;
}

  return typo(pick1(x)).replace(TERM_RE, (m, id, custom) => {
    const label = custom || typo(GLOSSARY[id].l[L()]);
    return interactive ? `<button type="button" class="term" data-term="${id}">${label}</button>` : `<span class="term">${label}</span>`;
  });
}
const plain = x => typo(pick1(x)).replace(TERM_RE, (m, id, custom) => custom || typo(GLOSSARY[id].l[L()])).replace(/<[^>]+>/g, "");
function termsIn(list) {
  const out = [];
  list.forEach(x => { for (const m of pick1(x).matchAll(TERM_RE)) if (!out.includes(m[1])) out.push(m[1]); });
  return out;
}

/* ---------- scoring ---------- */
const weigh = fx => Object.keys(fx).reduce((a, k) => a + WEIGHT[k] * fx[k], 0);
const memo = {};
function bounds(key) {                       // best and worst reachable totals from each node
  if (memo[key]) return memo[key];
  const N = SCENARIOS[key].nodes, best = {}, worst = {};
  const B = id => (id == null ? 0 : (best[id] ??= Math.max(...N[id].choices.map(c => weigh(c.fx) + B(c.next)))));
  const Wo = id => (id == null ? 0 : (worst[id] ??= Math.min(...N[id].choices.map(c => weigh(c.fx) + Wo(c.next)))));
  B(SCENARIOS[key].start); Wo(SCENARIOS[key].start);
  return (memo[key] = { best, worst });
}

const node = id => scen().nodes[id];
const chosen = p => node(p.n).choices[p.c];
function gauges(n = S.picks.length) {
  const g = { ...START };
  S.picks.slice(0, n).forEach(p => { const fx = chosen(p).fx; for (const k in fx) g[k] += fx[k]; });
  return g;
}
const clamp = v => Math.max(0, Math.min(100, v));
function scorePct() {
  const b = bounds(S.scen), st = scen().start, hi = b.best[st], lo = b.worst[st];
  const total = S.picks.reduce((a, p) => a + weigh(chosen(p).fx), 0);
  return Math.round(((total - lo) / (hi - lo)) * 100);
}
const gradeOf = pct => GRADES.find(g => pct >= g[1])[0];
function bestChoice(nodeId) {
  const b = bounds(S.scen), cs = node(nodeId).choices;
  return cs.reduce((a, c) => (weigh(c.fx) + (c.next ? b.best[c.next] : 0) > weigh(a.fx) + (a.next ? b.best[a.next] : 0) ? c : a));
}

    const delta = d ? `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${Math.abs(d)}</span>` : "";
    return `<div class="gauge"><div class="gauge-head">${icon(m.icon)}<span class="name">${pick1(m.name)}</span><span class="gauge-val">${delta}<span>${v}</span></span></div>
      <div class="meter" role="img" aria-label="${pick1(m.name)} ${v}/100"><i class="${v < 30 ? "low" : v < 60 ? "mid" : ""}" style="width:${from}%" data-to="${v}"></i></div></div>`;
  }).join("") + `</div>`;
}
function levelHTML(sc) {
  const name = I18N.levels[L()][sc.level - 1];
  return `<span class="level" title="${name}">${[1, 2, 3].map(i => `<i class="${i <= sc.level ? "on" : ""}"></i>`).join("")}</span><span>${name}</span>`;
}

function viewHome() {
  const best = store.get("best", {});
  const cards = SCENARIO_ORDER.filter(k => SCENARIOS[k]).map(k => {
    const sc = SCENARIOS[k], b = best[k];
    return `<button type="button" class="card" data-scen="${k}">
      <span class="card-icon">${icon(sc.icon)}</span>
      <span class="card-title">${typo(pick1(sc.title))}</span>
      <span class="card-pitch">${plain(sc.pitch)}</span>
      <span class="card-meta">${levelHTML(sc)}<span>≈ ${sc.minutes} min</span>${b != null ? `<span class="best">${t("bestLabel")} <b>${gradeOf(b)}</b></span>` : ""}</span>
    </button>`;
  }).join("");
  return `<section class="hero"><p class="eyebrow">${t("eyebrow")}</p><h1>${t("heroTitle")}</h1><p class="lede">${t("heroLede")}</p></section>
  <section class="block"><h2>${t("methodTitle")}</h2>
    <ol class="lifecycle">${METHOD.map((m, i) => `<li><span class="n">${i + 1}</span><b>${pick1(m[0])}</b><span>${typo(pick1(m[1]))}</span></li>`).join("")}</ol></section>
  <section class="block"><h2>${t("pick")}</h2><div class="cards">${cards}
    <button type="button" class="card card-random" data-act="random"><span class="card-icon">${icon("dice")}</span><span class="card-title">${t("random")}</span><span class="card-pitch">${t("randomPitch")}</span></button></div></section>`;
}

function viewBrief() {
  const sc = scen();
  return `<div><button type="button" class="btn btn-quiet" data-act="home">${icon("back")}${t("allScenarios")}</button></div>
  <section class="brief-grid">
    <div class="block">
      <p class="eyebrow">${t("scenario")} · ${I18N.levels[L()][sc.level - 1]} · ≈ ${sc.minutes} min</p>
      <h1>${typo(pick1(sc.title))}</h1>
      <dl class="facts"><div><dt>${t("company")}</dt><dd>${typo(pick1(sc.company))}</dd></div><div><dt>${t("role")}</dt><dd>${typo(pick1(sc.role))}</dd></div></dl>
      <p class="prose">${rich(sc.brief)}</p>
      <p class="muted">${t("briefGoal")}</p>
      <div><button type="button" class="btn btn-primary" data-act="start">${t("start")}${icon("arrow")}</button></div>
    </div>
    <aside class="rules"><h3>${t("gaugesTitle")}</h3>
      <ul>${METRICS.map(m => `<li>${icon(m.icon)}<b>${pick1(m.name)}</b><span>${typo(pick1(m.help))}</span></li>`).join("")}</ul>
      <p>${t("gaugesNote")}</p></aside>
  </section>`;
}

function logHTML() {
  const items = [];
  S.picks.forEach(p => {
    const n = node(p.n), c = chosen(p);
    items.push(`<li class="alert"><span class="when">${when(n)} · ${typo(pick1(n.src))}</span></li>`);
    items.push(`<li class="${c.v}"><span class="when">${t("decision")} · ${typo(pick1(VERDICT[c.v].label))}</span><span>${plain(c.t)}</span></li>`);
  });
  if (!answered()) { const n = node(S.cursor); items.push(`<li class="alert"><span class="when">${when(n)} · ${typo(pick1(n.src))}</span></li>`); }
  return `<aside class="log" aria-label="${t("logTitle")}"><div class="log-head"><button type="button" class="term" data-term="main_courante">${t("logTitle")}</button><span>${scen().company[L()].split(" · ")[0]}</span></div><ol>${items.join("")}</ol></aside>`;
}

function viewPlay() {
  const sc = scen(), n = node(S.cursor), done = answered();
  const cur = done ? S.picks[S.picks.length - 1] : null, c = cur && chosen(cur);
  const stepNo = n.phase + 1;
  const stepper = sc.phases.map((p, i) => `<li class="${i < n.phase ? "done" : i === n.phase ? "now" : ""}"${i === n.phase ? ' aria-current="step"' : ""}><span>${i + 1}. ${typo(pick1(p))}</span></li>`).join("");
  const vocab = termsIn([n.alert, ...n.choices.map(x => x.t)]);
  const order = S.order[S.cursor];
  const choices = order.map((ci, pos) => {
    const ch = n.choices[ci], mine = done && cur.c === ci;
    return `<button type="button" class="choice${mine ? " picked " + ch.v : ""}" data-choice="${ci}"${done ? " disabled" : ""}>
      <span class="key">${mine ? icon(VERDICT[ch.v].icon) : "ABCDEF"[pos]}</span><span>${rich(ch.t, false)}</span></button>`;
  }).join("");
  let feedback = "";
  if (done) {
    const chips = METRICS.filter(m => c.fx[m.k]).map(m => `<span class="${c.fx[m.k] > 0 ? "up" : "down"}">${c.fx[m.k] > 0 ? "+" : "−"}${Math.abs(c.fx[m.k])} ${pick1(m.name)}</span>`).join("");
    feedback = `<div class="feedback ${c.v}" id="feedback" role="status" tabindex="-1">
        <span class="verdict">${icon(VERDICT[c.v].icon)}${typo(pick1(VERDICT[c.v].label))}</span><p>${rich(c.why)}</p><div class="fx">${chips}</div></div>
      <div class="stage-actions"><button type="button" class="btn btn-primary" data-act="next">${c.next ? t("next") : t("toDebrief")}${icon("arrow")}</button></div>`;
  }
  return `<div class="playbar"><div><p class="eyebrow">${typo(pick1(sc.company))}</p><h1>${typo(pick1(sc.title))}</h1></div>
      <button type="button" class="btn btn-quiet" data-act="quit">${icon("x")}<span>${t("quit")}</span></button></div>
    <ol class="stepper">${stepper}</ol>
    ${gaugesHTML(gauges(), done ? gauges(S.picks.length - 1) : null, done ? c.fx : null)}
    <div class="cols"><div class="stage">
      <article class="ticket" id="ticket" tabindex="-1"><header class="ticket-head"><span class="live">${t("alert")}</span><span class="time">${when(n)}</span><span>${typo(pick1(n.src))}</span><span class="step">${t("step")} ${stepNo}/5</span></header>
        <div class="ticket-body">${rich(n.alert)}</div></article>
      ${vocab.length ? `<div class="vocab"><span>${t("vocab")}</span>${vocab.map(id => `<button type="button" class="chip" data-term="${id}">${typo(GLOSSARY[id].l[L()])}</button>`).join("")}</div>` : ""}
      <p class="ask" id="ask">${t("ask")}</p>
      <div class="choices" role="group" aria-labelledby="ask">${choices}</div>
      ${feedback}
    </div>${logHTML()}</div>`;
}

function seenTerms() {
  const sc = scen(), texts = [sc.brief];
  S.picks.forEach(p => { const n = node(p.n); texts.push(n.alert, ...n.choices.map(c => c.t), chosen(p).why, bestChoice(p.n).t); });
  return termsIn(texts).sort((a, b) => GLOSSARY[a].l[L()].localeCompare(GLOSSARY[b].l[L()], S.lang));
}
const termsHTML = ids => ids.map(id => `<div><dt>${typo(GLOSSARY[id].l[L()])}</dt><dd>${typo(GLOSSARY[id].d[L()])}</dd></div>`).join("");

function viewDebrief() {
  const sc = scen(), pct = scorePct(), g = gradeOf(pct);
  const review = S.picks.map(p => {
    const n = node(p.n), c = chosen(p), b = bestChoice(p.n);
    return `<li class="${c.v}"><div class="where"><span>${n.phase + 1} · ${typo(pick1(sc.phases[n.phase]))}</span><span>${when(n)}</span><span class="verdict ${c.v}">${icon(VERDICT[c.v].icon)}${typo(pick1(VERDICT[c.v].label))}</span></div>
      <p class="picked">${rich(c.t)}</p><p>${rich(c.why)}</p>
      ${c.v !== "good" ? `<div class="better"><b>${t("better")}</b><span>${rich(b.t)}</span><span class="muted">${rich(b.why)}</span></div>` : ""}</li>`;
  }).join("");
  return `<section class="result"><div class="grade" aria-label="${t("rGrade")} ${g}">${g}</div>
      <div class="block"><p class="eyebrow">${t("debrief")} · ${typo(pick1(sc.title))}</p><h1>${typo(pick1(I18N.gradeTitle[g]))}</h1>
      <p>${typo(pick1(I18N.gradeLine[g]))}</p><p class="sub">${t("score")} <b>${pct}/100</b>, ${t("scoreNote")}</p></div></section>
    <section class="block"><h2>${t("finalState")}</h2>${gaugesHTML(gauges())}</section>
    <section class="block"><h2>${t("yourPath")}</h2><ol class="review">${review}</ol></section>
    <section class="block"><h2>${t("takeaways")}</h2><ul class="takeaways">${sc.takeaways.map(x => `<li>${icon("check")}<span>${rich(x)}</span></li>`).join("")}</ul></section>
    <section class="block"><h2>${t("seenTerms")}</h2><dl class="terms">${termsHTML(seenTerms())}</dl></section>
    <div class="end-actions"><button type="button" class="btn btn-primary" data-act="replay">${icon("replay")}${t("replay")}</button>
      <button type="button" class="btn" data-act="home">${t("other")}</button>
      <button type="button" class="btn" data-act="report">${icon("report")}${t("report")}</button></div>`;
}

function reportText() {
  const sc = scen(), pct = scorePct(), g = gradeOf(pct), gv = gauges(), out = [];
  out.push(`CRISIS CONTROL — ${plain(I18N.report).toUpperCase()}`, "");
  out.push(`${plain(I18N.scenario)} : ${plain(sc.title)} (${plain(sc.company)})`);
  out.push(`${plain(I18N.role)} : ${plain(sc.role)}`);
  out.push(`${plain(I18N.rDate)} : ${new Date().toLocaleDateString(S.lang === "fr" ? "fr-FR" : "en-GB")}`);
  out.push(`${plain(I18N.rGrade)} : ${g} — ${plain(I18N.gradeTitle[g])} (${pct}/100)`, "");
  out.push(plain(I18N.rGauges));
  METRICS.forEach(m => out.push(`- ${pick1(m.name)} : ${clamp(gv[m.k])}/100`));
  out.push("", plain(I18N.rDecisions));
  S.picks.forEach((p, i) => {
    const n = node(p.n), c = chosen(p), b = bestChoice(p.n);
    out.push(`${i + 1}. ${plain(sc.phases[n.phase])} [${when(n)}] — ${plain(n.src)}`);
    out.push(`   ${plain(n.alert)}`);
    out.push(`   ${plain(I18N.decision)} : ${plain(c.t)}`);
    out.push(`   ${plain(I18N.rEval)} : ${plain(VERDICT[c.v].label)}`);
    out.push(`   ${plain(I18N.rWhy)} : ${plain(c.why)}`);
    if (c.v !== "good") out.push(`   ${plain(I18N.better)} : ${plain(b.t)}`);
    out.push("");
  });
  out.push(plain(I18N.takeaways).toUpperCase());
  sc.takeaways.forEach(x => out.push(`- ${plain(x)}`));
  out.push("", plain(I18N.seenTerms).toUpperCase());
  seenTerms().forEach(id => out.push(`- ${typo(GLOSSARY[id].l[L()])} : ${typo(GLOSSARY[id].d[L()])}`));
  return out.join("\n");
}

/* ---------- rendering ---------- */
function render() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = plain(I18N[el.dataset.i]); });
  document.querySelectorAll(".seg [data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  $("lexSearch").placeholder = plain(I18N.search);
  $("btnDownload").hidden = !CAN_DOWNLOAD;
  $("helpBody").innerHTML = `<ol class="how">${I18N.how.map(x => `<li><span>${typo(pick1(x))}</span></li>`).join("")}</ol><p>${t("howScore")}</p><p>${t("howKeys")}</p>`;
  hidePop();
  const view = $("view");
  view.innerHTML = { home: viewHome, brief: viewBrief, play: viewPlay, debrief: viewDebrief }[S.screen]();
  requestAnimationFrame(() => view.querySelectorAll(".meter i[data-to]").forEach(i => { i.style.width = i.dataset.to + "%"; }));
  if ($("dlgLex").open) renderLexicon();
  if ($("dlgReport").open) $("reportText").value = reportText();
}
function go(screen, top = true) { S.screen = screen; render(); if (top) window.scrollTo(0, 0); }
function shuffle(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function enter(nodeId) { S.cursor = nodeId; S.order[nodeId] ??= shuffle(node(nodeId).choices.length); }
function openScenario(key) { S.scen = key; S.picks = []; S.order = {}; S.cursor = null; go("brief"); }
function startScenario() { S.picks = []; S.order = {}; enter(scen().start); go("play"); }
function choose(ci) {
  if (S.screen !== "play" || answered() || !node(S.cursor).choices[ci]) return;
  S.picks.push({ n: S.cursor, c: ci });
  render();
  const fb = $("feedback");
  if (fb) { fb.focus({ preventScroll: true }); fb.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}
function advance() {
  if (!answered()) return;
  const c = chosen(S.picks[S.picks.length - 1]);
  if (!c.next) {
    const best = store.get("best", {}), pct = scorePct();
    if (best[S.scen] == null || pct > best[S.scen]) { best[S.scen] = pct; store.set("best", best); }
    go("debrief");
    return;
  }
  enter(c.next); render();
  const tk = $("ticket");
  if (tk) { tk.focus({ preventScroll: true }); if (tk.getBoundingClientRect().top < 0 || tk.getBoundingClientRect().top > innerHeight * 0.5) tk.scrollIntoView({ block: "start", behavior: "smooth" }); }
}

/* ---------- glossary popover, lexicon, report ---------- */
let popFor = null;
function hidePop() { $("pop").hidden = true; if (popFor) popFor.removeAttribute("aria-describedby"); popFor = null; }
function showPop(el) {
  const g = GLOSSARY[el.dataset.term], pop = $("pop");
  if (!g) return;
  if (popFor === el) { hidePop(); return; }
  hidePop();
  pop.innerHTML = `<b>${typo(g.l[L()])}</b>${typo(g.d[L()])}`;
  pop.hidden = false;
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.max(12, Math.min(r.left, innerWidth - pw - 12));
  const top = r.bottom + 8 + ph > innerHeight && r.top - ph - 8 > 0 ? r.top - ph - 8 : r.bottom + 8;
  pop.style.left = left + "px"; pop.style.top = top + "px";
  popFor = el; el.setAttribute("aria-describedby", "pop");
}
function renderLexicon() {
  const q = $("lexSearch").value.trim().toLowerCase();
  const ids = Object.keys(GLOSSARY).filter(id => !q || (GLOSSARY[id].l[L()] + " " + GLOSSARY[id].d[L()]).toLowerCase().includes(q))
    .sort((a, b) => GLOSSARY[a].l[L()].localeCompare(GLOSSARY[b].l[L()], S.lang));
  $("lexList").innerHTML = ids.length ? termsHTML(ids) : `<p class="muted">${t("noTerm")}</p>`;
}
function openDialog(id) { hidePop(); const d = $(id); if (!d.open) d.showModal(); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const term = e.target.closest("[data-term]");
  if (term) { showPop(term); return; }
  if (!e.target.closest("#pop")) hidePop();
  const closer = e.target.closest("[data-close]");
  if (closer) { closer.closest("dialog").close(); return; }
  if (e.target instanceof HTMLDialogElement) { e.target.close(); return; }     // click on the backdrop
  const lang = e.target.closest("[data-lang]");
  if (lang) { S.lang = lang.dataset.lang; store.set("lang", S.lang); render(); return; }
  const card = e.target.closest("[data-scen]");
  if (card) { openScenario(card.dataset.scen); return; }
  const ch = e.target.closest("[data-choice]");
  if (ch) { choose(Number(ch.dataset.choice)); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  switch (act.dataset.act) {
    case "home": go("home"); break;
    case "random": { const keys = SCENARIO_ORDER.filter(k => SCENARIOS[k]); openScenario(keys[Math.floor(Math.random() * keys.length)]); break; }
    case "start": case "replay": startScenario(); break;
    case "next": advance(); break;
    case "report": $("reportText").value = reportText(); $("copyMsg").textContent = ""; openDialog("dlgReport"); break;
    case "quit":
      if (act.dataset.armed) { go("home"); break; }
      act.dataset.armed = "1"; act.querySelector("span").textContent = plain(I18N.quitConfirm);
      setTimeout(() => { if (act.isConnected) { delete act.dataset.armed; act.querySelector("span").textContent = plain(I18N.quit); } }, 4000);
      break;
  }
});
$("btnLex").addEventListener("click", () => { $("lexSearch").value = ""; renderLexicon(); openDialog("dlgLex"); });
$("btnHelp").addEventListener("click", () => openDialog("dlgHelp"));
$("lexSearch").addEventListener("input", renderLexicon);
$("btnCopy").addEventListener("click", () => {
  const ta = $("reportText"), msg = $("copyMsg");
  const fallback = () => { ta.focus(); ta.select(); msg.textContent = plain(I18N.copyFail); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = plain(I18N.copied); }, fallback);
  else fallback();
});
$("btnDownload").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([$("reportText").value], { type: "text/plain;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = `crisis-control-${S.scen}.txt`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { hidePop(); return; }
  if (S.screen !== "play" || answered() || e.ctrlKey || e.metaKey || e.altKey || document.querySelector("dialog[open]")) return;
  if (/^(input|textarea|select)$/i.test(e.target.tagName)) return;
  const pos = "abcdef".indexOf(e.key.toLowerCase());
  if (pos >= 0 && pos < S.order[S.cursor].length) { e.preventDefault(); choose(S.order[S.cursor][pos]); }
});
window.addEventListener("scroll", hidePop, { passive: true });
window.addEventListener("resize", hidePop);
(function logoFallback() {
  const img = $("logoImg"), swap = () => { img.hidden = true; $("logoFallback").removeAttribute("hidden"); };
  if (img.complete && img.naturalWidth === 0) swap(); else img.addEventListener("error", swap);
})();

/* ---------- start-up ---------- */
function boot(saved) {
  S.lang = store.get("lang", (navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en");
  const d = saved || {};
  try {                                       // restore a game in progress if the host hands one back
    if (d.lang) S.lang = d.lang;
    if (d.scen && SCENARIOS[d.scen]) {
      S.scen = d.scen; S.picks = []; S.order = d.order || {};
      let id = scen().start;
      for (const p of d.picks || []) { if (p.n !== id || !node(id).choices[p.c]) break; S.picks.push(p); id = node(id).choices[p.c].next; }
      const last = S.picks[S.picks.length - 1];
      if (d.screen === "play" || d.screen === "debrief") enter(d.screen === "play" && d.cursor && scen().nodes[d.cursor] ? d.cursor : last ? last.n : scen().start);
      S.screen = d.screen === "debrief" && (!last || chosen(last).next) ? "play" : d.screen || "brief";
    }
  } catch (e) { S.screen = "home"; S.scen = null; S.picks = []; }
  const hash = location.hash.slice(1);
  if (S.screen === "home" && SCENARIOS[hash]) { S.scen = hash; S.screen = "brief"; }
  render();
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ lang: S.lang, screen: S.screen, scen: S.scen, picks: S.picks, cursor: S.cursor, order: S.order })); } catch (e) { /* optional */ }
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data);
</script>
</body>

</html>
